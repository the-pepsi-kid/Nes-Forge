name: RC2 legacy wallet protocol verification

on:
  push:
    branches:
      - main
      - review/rc2-build5-wallet-server-2026-11-04
    paths:
      - public-review/rc2-build5/wallet/**
      - public-review/rc2-build5/NES_Forge_RC2_Build_5_Public_Review_Candidate_1.zip
      - .github/workflows/rc2-wallet-package.yml
  pull_request:
    paths:
      - public-review/rc2-build5/wallet/**
      - .github/workflows/rc2-wallet-package.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install localhost test dependencies
        run: python -m pip install -r public-review/rc2-build5/wallet/requirements.txt
      - name: Verify host Python and client JavaScript
        run: |
          python -m compileall -q public-review/rc2-build5/wallet/host
          node --check public-review/rc2-build5/wallet/host/client.js
          node --check public-review/rc2-build5/wallet/host/render-world.js
          python public-review/rc2-build5/wallet/host/diagnose.py
      - name: Verify historical Candidate 2 archive is unchanged
        run: |
          python - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          p = Path("public-review/rc2-build5/NES_Forge_RC2_Build_5_Public_Wallet_Review_Candidate_2.zip")
          expected = "e04123021acfa750eba17086e3e068207ab14b128c4a9539b9fa90babb4618e1"
          assert p.exists() and sha256(p.read_bytes()).hexdigest() == expected, "Immutable Candidate 2 ZIP has drifted"
          print("PASS: historical Candidate 2 ZIP unchanged")
          PY
      - name: Smoke-test protocol 13, wallet auth rejection and archived package
        run: python public-review/rc2-build5/wallet/tests/test_wallet_package.py
