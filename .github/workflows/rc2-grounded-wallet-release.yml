name: RC2 grounded wallet alpha review

on:
  push:
    branches:
      - main
      - review/rc2-grounded-player-presentation-2026-11-05
    paths:
      - public-review/rc2-build5/wallet/**
      - public-review/rc2-build5/NES_Forge_RC2_Build_5_Public_Wallet_Review_Candidate_2.zip
      - docs/getting-started/**
      - .github/workflows/rc2-grounded-wallet-release.yml
  pull_request:
    paths:
      - public-review/rc2-build5/wallet/**
      - docs/getting-started/**
      - .github/workflows/rc2-grounded-wallet-release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rc2-grounded-wallet-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-check-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout RC2 public repository
        uses: actions/checkout@v4
      - name: Use Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install localhost host requirements
        run: python -m pip install -r public-review/rc2-build5/wallet/requirements.txt
      - name: Restore reviewed source-only host modules for acceptance
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          root=Path("public-review/rc2-build5/wallet")
          sys.path.insert(0,str(root.resolve()))
          from build_grounded_wallet_release import (
              read_source_archive, HOST_FILES, EXTRA_FILES,
              PATCH, PATCH_SHA256, SUPPLEMENT, SUPPLEMENT_SHA256,
          )
          files=read_source_archive(PATCH,PATCH_SHA256,HOST_FILES)
          extra=read_source_archive(SUPPLEMENT,SUPPLEMENT_SHA256,EXTRA_FILES)
          needle=b"source=ROOT.parent/'NES_Forge_3x_v17_Hosted_Link_Actions_Experimental.html'"
          assert files["host/server.py"].count(needle)==1
          files["host/server.py"]=files["host/server.py"].replace(
              needle,b"source=ROOT.parent/'NES_Forge.html'")
          needle=b"HTML=ROOT/'NES_Forge_3x_v17_Hosted_Link_Actions_Experimental.html'"
          assert extra["PREPARE_PRIVATE_Z2_DEMO.py"].count(needle)==1
          extra["PREPARE_PRIVATE_Z2_DEMO.py"]=extra["PREPARE_PRIVATE_Z2_DEMO.py"].replace(
              needle,b"HTML=ROOT/'NES_Forge.html'")
          for key,data in {**files,**extra}.items():
              dest=root/key
              dest.parent.mkdir(parents=True,exist_ok=True)
              dest.write_bytes(data)
          print("Restored",len(files),"host and",len(extra),"review/test source files")
          PY
      - name: Verify Python and client JavaScript syntax
        run: |
          python -m compileall -q public-review/rc2-build5/wallet/host
          python -m py_compile public-review/rc2-build5/wallet/PREPARE_PRIVATE_Z2_DEMO.py
          for file in public-review/rc2-build5/wallet/host/*.js; do node --check "$file"; done
          python public-review/rc2-build5/wallet/host/diagnose.py
      - name: Verify Rev 8 source-frame continuity and ground alignment
        run: |
          python public-review/rc2-build5/wallet/tests/test_rev8_frame_presentation.py
          node public-review/rc2-build5/wallet/tests/test_grounded_client.cjs
      - name: Verify legacy wallet-protocol smoke
        run: python public-review/rc2-build5/wallet/tests/test_wallet_package.py
      - name: Assemble new grounded Candidate 3 ZIP
        run: python public-review/rc2-build5/wallet/build_grounded_wallet_release.py
      - name: Verify source/editor SHA, standalone host, tutorial and native editor
        run: python public-review/rc2-build5/wallet/tests/test_grounded_candidate.py
      - name: Upload validated ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: RC2-Build-5-Grounded-Wallet-Review-Candidate-3
          path: public-review/rc2-build5/NES_Forge_RC2_Build_5_Grounded_Wallet_Review_Candidate_3.zip
          if-no-files-found: error
      - name: Publish validated standalone ZIP and reviewed plain host sources to main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public-review/rc2-build5/NES_Forge_RC2_Build_5_Grounded_Wallet_Review_Candidate_3.zip
          git add public-review/rc2-build5/wallet/host
          git add public-review/rc2-build5/wallet/PREPARE_PRIVATE_Z2_DEMO.py
          git add public-review/rc2-build5/wallet/Windows_02_Prepare_Private_ROM_Demo.cmd
          git add public-review/rc2-build5/wallet/tests/test_rev8_frame_presentation.py
          git add public-review/rc2-build5/wallet/tests/test_rev3_original_floor_browser.py
          if ! git diff --cached --quiet; then
            git commit -m "build(rc2): publish grounded Candidate 3 and reviewed localhost source"
            git push origin HEAD:main
          fi
